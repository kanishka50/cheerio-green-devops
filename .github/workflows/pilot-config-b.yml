name: Pilot - Config B (Full, cached)

# ---------------------------------------------------------------------------
# PILOT - Green DevOps experiment (Phase 7). NOT final data collection.
#
# Purpose of this pilot pair (Config A vs Config B):
#   1. Measure RUN-TO-RUN VARIANCE of one configuration repeated, which is what
#      decides whether the effects the hypotheses predict are detectable at all.
#   2. Give a first reading on H1 (caching reduces energy).
#
# A and B differ in EXACTLY ONE thing: the `cache:` key on setup-node.
# Both files are generated from one template so nothing else can drift.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CONFIG_ID: 'B'
  # Upstream commit this fork was taken from, for the record. Re-pin the
  # checkout to a frozen SHA before final data collection begins.
  UPSTREAM_SHA: 402946f2127a21b2e5315dd340d176eeb328f085
  # Controls
  TZ: UTC
  LANG: C.UTF-8
  FORCE_COLOR: '0'

jobs:
  run:
    name: Config B - Full (cached)
    runs-on: ubuntu-latest

    steps:
      - name: Log runner context
        run: |
          echo "RUN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "=== RUNNER CONTEXT (control variables) ==="
          echo "Config:   ${{ env.CONFIG_ID }}"
          echo "Image:    ${ImageOS:-unknown} / ${ImageVersion:-unknown}"
          echo "CPU:      $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          echo "Cores:    $(nproc)"
          echo "Kernel:   $(uname -r)"

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Constancy of the subject application is OBSERVED in every run's log
      # rather than merely asserted, so all runs can be verified afterwards as
      # having measured one and the same commit.
      - name: Log measured commit
        run: |
          echo "SUBJECT COMMIT: $(git rev-parse HEAD)"
          echo "SUBJECT TREE:   $(git rev-parse HEAD:src)"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # THE SINGLE VARIABLE under test. Everything else in this file
          # is byte-identical to Config A.
          cache: 'npm'
      - name: ECO-CI - start measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          send-data: false
          # MUST be set HERE. ECO-CI reads json-output only in start-measurement
          # (it is passed to setup.sh); setting it on display-results is silently
          # ignored, and then /tmp/eco-ci/total-data.json is never written and
          # the data-total-json / data-lap-json outputs come back EMPTY.
          json-output: true

      # ================= STAGE 1: INSTALL =================
      - name: Install dependencies
        run: npm ci

      - name: ECO-CI - measure install
        id: eco_install
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: install
          send-data: false

      # ================= STAGE 2: LINT =================
      # `npm run lint` = eslint . && tsc --noEmit && biome check .
      # `eslint .` walks into website/, a SECOND npm project whose dependencies
      # root `npm ci` does not install, so it dies on `astro/tsconfigs/strict`.
      # The subject application is the cheerio LIBRARY, so eslint is scoped to
      # it. tsc already excludes website/ (tsconfig.json "exclude") and biome
      # does not resolve imports, so both of those run unchanged.
      - name: Lint
        run: |
          npx eslint . --ignore-pattern "website/**"
          npm run lint:ts
          npm run lint:biome

      - name: ECO-CI - measure lint
        id: eco_lint
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: lint
          send-data: false

      # ================= STAGE 3: TEST =================
      - name: Test
        run: npm run test:vi

      - name: ECO-CI - measure test
        id: eco_test
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: test
          send-data: false

      # ================= STAGE 4: BUILD =================
      - name: Build
        run: npm run build

      - name: ECO-CI - measure build
        id: eco_build
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: build
          send-data: false

      # ================= STAGE 5: DEPLOY =================
      # cheerio is a library, so "deploy" is publication rather than a server
      # release: `npm pack` performs the packaging work, then the tarball is
      # transferred to a remote artefact store. Nothing is published to npm.
      # LIMITATION: this is publication, not server deployment, so the deploy
      # stage's energy SHARE is not generalisable to server-deploying pipelines.
      # It cannot affect H1-H4, the stage being identical in all five configs.
      - name: Deploy (package)
        run: npm pack

      - name: Deploy (upload artefact)
        uses: actions/upload-artifact@v4
        with:
          name: package-B-${{ github.run_id }}-${{ github.run_attempt }}
          path: '*.tgz'
          compression-level: 6
          retention-days: 1
          if-no-files-found: error

      - name: ECO-CI - measure deploy
        id: eco_deploy
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: deploy
          send-data: false

      # ================= RESULTS =================
      - name: ECO-CI - display results
        id: eco_total
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          send-data: false

      # ECO-CI writes its results table to the job log ONLY. Across 153 runs a
      # log is not a dataset, so the measurement JSON and this run's control
      # variables are written to files and uploaded for offline analysis.
      - name: Write result files
        if: always()
        env:
          ECO_TOTAL: ${{ steps.eco_total.outputs.data-total-json }}
          LAP_INSTALL: ${{ steps.eco_install.outputs.data-lap-json }}
          LAP_LINT: ${{ steps.eco_lint.outputs.data-lap-json }}
          LAP_TEST: ${{ steps.eco_test.outputs.data-lap-json }}
          LAP_BUILD: ${{ steps.eco_build.outputs.data-lap-json }}
          LAP_DEPLOY: ${{ steps.eco_deploy.outputs.data-lap-json }}
        run: |
          mkdir -p results
          printf '%s' "$ECO_TOTAL"   > results/eco-total.json
          printf '%s' "$LAP_INSTALL" > results/lap-install.json
          printf '%s' "$LAP_LINT"    > results/lap-lint.json
          printf '%s' "$LAP_TEST"    > results/lap-test.json
          printf '%s' "$LAP_BUILD"   > results/lap-build.json
          printf '%s' "$LAP_DEPLOY"  > results/lap-deploy.json
          {
            echo '{'
            echo '  "config": "B",'
            echo '  "run_id": "${{ github.run_id }}",'
            echo '  "run_number": "${{ github.run_number }}",'
            echo '  "run_attempt": "${{ github.run_attempt }}",'
            echo '  "commit": "'"$(git rev-parse HEAD)"'",'
            echo '  "src_tree": "'"$(git rev-parse HEAD:src)"'",'
            echo '  "runner_image": "'"${ImageOS:-unknown}/${ImageVersion:-unknown}"'",'
            echo '  "cpu_model": "'"$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"'",'
            echo '  "cpu_cores": "'"$(nproc)"'",'
            echo '  "eco_power_model": "github_EPYC_7763_4_CPU_shared.sh",'
            echo '  "started_utc": "${{ env.RUN_STARTED }}",'
            echo '  "finished_utc": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"'
            echo '}'
          } > results/meta.json
          echo "=== meta.json ==="
          cat results/meta.json
          echo "=== eco-total.json (first 600 chars) ==="
          head -c 600 results/eco-total.json || true
          echo

          # Fail LOUDLY on an empty measurement. A silently empty capture would
          # otherwise be discovered only after all 153 runs were complete.
          if [ ! -s results/eco-total.json ]; then
            echo "::error::eco-total.json is EMPTY. ECO-CI wrote no measurement JSON - check that json-output:true is on the start-measurement step."
            exit 1
          fi

          # The runner hardware must match the power model ECO-CI estimates with.
          # GitHub's fleet is heterogeneous, so this is checked every run rather
          # than assumed; a mismatch is a systematic bias in the ABSOLUTE energy
          # figures (comparisons between configurations remain valid).
          CPU="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          case "$CPU" in
            *7763*) echo "Power model MATCHES runner CPU ($CPU)." ;;
            *) echo "::warning::Runner CPU is '$CPU' but ECO-CI estimates with the EPYC 7763 power model. Absolute Joules carry a systematic bias - record in threats-to-validity and stratify by cpu_model at analysis." ;;
          esac

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-B-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          retention-days: 30
          if-no-files-found: error
